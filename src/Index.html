<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #F3F5F8; --card: #FFFFFF; --ink: #14243A; --muted: #6B7785; --line: #E4E8EE;
        --field: #F7F9FB; --brand: #1F3A5F; --brand-2: #2F5D8C; --on-brand: #FFFFFF;
        --chip: #EEF2F7; --ok: #1E7F4F; --err: #B42318;
        --shadow: 0 1px 2px rgba(20,36,58,.06), 0 8px 24px rgba(20,36,58,.06);
        --c0: #2F6FDE; --c1: #12A594; --c2: #E5484D; --c3: #F5A524; --c4: #8E4EC6; --c5: #0091FF; --c6: #E93D82; --c7: #8B8D98;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0E1420; --card: #172131; --ink: #E8EDF4; --muted: #93A0B1; --line: #263347;
          --field: #111A28; --brand: #2F5D8C; --brand-2: #3F78B3; --chip: #1F2B3D;
          --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
        }
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body { margin: 0; font-family: Inter, Arial, Helvetica, sans-serif; background: var(--bg); color: var(--ink); }
      main { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }

      header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
      header h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
      header .today { font-size: 13px; color: var(--muted); }

      /* Hero: this month's spend */
      .hero {
        background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
        color: var(--on-brand); border-radius: 20px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px;
      }
      .hero .label { font-size: 13px; opacity: .8; }
      .hero .amount { font-size: 34px; font-weight: 700; letter-spacing: -.02em; margin: 4px 0 2px; }
      .hero .sub { font-size: 13px; opacity: .8; }
      .bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: rgba(255,255,255,.18); margin: 16px 0 12px; }
      .bar span { height: 100%; transition: width .4s ease; }
      .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 13px; }
      .legend div { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .legend i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
      .legend b { margin-left: auto; font-weight: 600; white-space: nowrap; }
      .legend .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .9; }

      .card { background: var(--card); border-radius: 20px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
      .card h2 { font-size: 15px; font-weight: 600; margin: 0 0 14px; }

      label, .lbl { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin: 14px 0 6px; }
      input, select, textarea {
        width: 100%; font: inherit; font-size: 16px; color: var(--ink);
        padding: 13px 14px; background: var(--field); border: 1.5px solid var(--line); border-radius: 12px;
        transition: border-color .15s, background .15s;
      }
      input::placeholder, textarea::placeholder { color: var(--muted); opacity: .7; }
      input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand-2); background: var(--card); }
      .first label { margin-top: 0; }

      .money { position: relative; }
      .money span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; }
      .money input { padding-left: 44px; font-size: 22px; font-weight: 600; }

      .chips { display: flex; flex-wrap: wrap; gap: 8px; }
      .chip {
        border: 1.5px solid transparent; background: var(--chip); color: var(--ink);
        padding: 8px 12px; border-radius: 99px; font: inherit; font-size: 14px; cursor: pointer;
        display: inline-flex; align-items: center; gap: 6px; transition: all .15s;
      }
      .chip[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); }

      .row { display: flex; gap: 10px; align-items: flex-end; }
      .row > * { flex: 1; min-width: 0; }
      .stepper { display: flex; align-items: center; background: var(--field); border: 1.5px solid var(--line); border-radius: 12px; }
      .stepper button {
        width: 44px; height: 48px; border: 0; background: none; color: var(--ink);
        font-size: 22px; cursor: pointer; flex: none;
      }
      .stepper input { border: 0; background: none; text-align: center; padding: 0; font-weight: 600; min-width: 0; }
      .stepper input:focus { background: none; }

      details { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
      summary { cursor: pointer; font-size: 14px; font-weight: 500; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 6px; }
      summary::-webkit-details-marker { display: none; }
      summary::before { content: "+"; font-size: 18px; width: 18px; text-align: center; }
      details[open] summary::before { content: "−"; }

      .total-line { display: flex; justify-content: space-between; align-items: baseline; margin-top: 18px; font-size: 14px; color: var(--muted); }
      .total-line strong { font-size: 18px; color: var(--ink); }

      .save {
        width: 100%; margin-top: 14px; padding: 16px; border: 0; border-radius: 14px; cursor: pointer;
        background: var(--brand); color: var(--on-brand); font: inherit; font-size: 16px; font-weight: 600;
        transition: transform .1s, opacity .15s;
      }
      .save:active { transform: scale(.98); }
      .save:disabled { opacity: .6; }

      ul { list-style: none; margin: 0; padding: 0; }
      li.item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
      li.item:first-child { border-top: 0; padding-top: 0; }
      .avatar { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 19px; flex: none; }
      .info { flex: 1; min-width: 0; }
      .info .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
      .price { font-weight: 600; white-space: nowrap; }
      .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 12px 0; }

      .skeleton { background: linear-gradient(90deg, var(--chip) 25%, var(--line) 50%, var(--chip) 75%); background-size: 200% 100%; animation: sh 1.2s infinite; border-radius: 8px; }
      .hero .skeleton { background: rgba(255,255,255,.18); }
      @keyframes sh { to { background-position: -200% 0; } }

      #toast {
        position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
        padding: 12px 18px; border-radius: 12px; color: #fff; font-size: 14px; font-weight: 500;
        box-shadow: var(--shadow); transition: all .25s ease; white-space: nowrap;
      }
      #toast.show { transform: translate(-50%, 0); opacity: 1; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Home Stock</h1>
        <span class="today" id="today"></span>
      </header>

      <section class="hero" aria-live="polite">
        <div class="label" id="month">This month</div>
        <div class="amount" id="month-total"><div class="skeleton" style="height:38px;width:60%"></div></div>
        <div class="sub" id="month-items">&nbsp;</div>
        <div class="bar" id="bar"></div>
        <div class="legend" id="legend"></div>
      </section>

      <form id="add-form" class="card" autocomplete="off" novalidate>
        <h2>Add item</h2>
        <div class="first">
          <label for="item">Item</label>
          <input id="item" name="item" placeholder="e.g. Rice 5kg" required>
        </div>

        <label for="price">Price per unit</label>
        <div class="money">
          <span>Rp</span>
          <input id="price" name="price" inputmode="numeric" placeholder="0" required>
        </div>

        <span class="lbl">Category</span>
        <div class="chips" id="categories"></div>
        <input type="hidden" id="category" name="category">

        <div class="row">
          <div>
            <span class="lbl">Quantity</span>
            <div class="stepper">
              <button type="button" id="minus" aria-label="Decrease quantity">−</button>
              <input id="quantity" name="quantity" inputmode="decimal" value="1" aria-label="Quantity">
              <button type="button" id="plus" aria-label="Increase quantity">+</button>
            </div>
          </div>
          <div>
            <label for="unit">Unit</label>
            <select id="unit" name="unit"><option value="">–</option></select>
          </div>
        </div>

        <details>
          <summary>More details</summary>
          <label for="location">Location</label>
          <select id="location" name="location"><option value="">–</option></select>
          <label for="date">Date</label>
          <input id="date" name="date" type="date">
          <label for="notes">Notes</label>
          <textarea id="notes" name="notes" rows="2" placeholder="Optional"></textarea>
        </details>

        <div class="total-line"><span>Total</span><strong id="line-total">Rp0</strong></div>
        <button id="save" class="save" type="submit">Save item</button>
      </form>

      <section class="card">
        <h2>Recent items</h2>
        <ul id="recent">
          <li class="item"><div class="skeleton" style="height:40px;width:100%"></div></li>
          <li class="item"><div class="skeleton" style="height:40px;width:100%"></div></li>
        </ul>
      </section>
    </main>

    <div id="toast" role="status"></div>

    <script>
      const $ = id => document.getElementById(id);
      const ICONS = { food: '🍚', drinks: '🥤', cleaning: '🧽', toiletries: '🧴', medicine: '💊', household: '🏠', other: '📦', uncategorized: '📦' };
      const PALETTE = ['--c0', '--c1', '--c2', '--c3', '--c4', '--c5', '--c6', '--c7'];
      let categoryOrder = [];

      const fmt = n => 'Rp' + Math.round(n || 0).toLocaleString('en-US');
      const digits = s => String(s).replace(/[^\d]/g, '');
      const icon = c => ICONS[String(c || '').toLowerCase()] || '📦';
      const color = c => {
        const i = categoryOrder.indexOf(c);
        return `var(${PALETTE[i >= 0 ? i % PALETTE.length : PALETTE.length - 1]})`;
      };
      const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const localISO = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);

      function toast(msg, ok) {
        const t = $('toast');
        t.textContent = (ok ? '✓  ' : '') + msg;
        t.style.background = ok ? 'var(--ok)' : 'var(--err)';
        t.classList.add('show');
        clearTimeout(t._h);
        t._h = setTimeout(() => t.classList.remove('show'), 2400);
      }

      /* ---------- Form ---------- */
      function qty() { const q = parseFloat($('quantity').value); return isNaN(q) || q <= 0 ? 1 : q; }
      function updateTotal() { $('line-total').textContent = fmt(Number(digits($('price').value)) * qty()); }

      $('price').addEventListener('input', e => {
        const d = digits(e.target.value);
        e.target.value = d ? Number(d).toLocaleString('en-US') : '';
        updateTotal();
      });
      $('quantity').addEventListener('input', updateTotal);
      $('minus').onclick = () => { $('quantity').value = Math.max(1, Math.ceil(qty()) - 1); updateTotal(); };
      $('plus').onclick = () => { $('quantity').value = Math.floor(qty()) + 1; updateTotal(); };

      function renderChips(categories) {
        categoryOrder = categories.concat(['Uncategorized']);
        $('categories').innerHTML = categories.map(c =>
          `<button type="button" class="chip" aria-pressed="false" data-v="${esc(c)}">${icon(c)} ${esc(c)}</button>`).join('');
        $('categories').onclick = e => {
          const b = e.target.closest('.chip'); if (!b) return;
          const on = b.getAttribute('aria-pressed') !== 'true';
          $('categories').querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', 'false'));
          b.setAttribute('aria-pressed', String(on));
          $('category').value = on ? b.dataset.v : '';
        };
      }

      function fillSelect(sel, values) { values.forEach(v => sel.add(new Option(v, v))); }

      function resetForm() {
        ['item', 'price', 'notes'].forEach(id => ($(id).value = ''));
        $('quantity').value = 1;
        updateTotal();
        $('item').focus();
      }

      $('add-form').addEventListener('submit', e => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));
        data.price = digits(data.price);
        if (!data.item.trim()) { $('item').focus(); return toast('Enter an item name', false); }
        if (!data.price) { $('price').focus(); return toast('Enter a price', false); }
        $('save').disabled = true; $('save').textContent = 'Saving…';
        google.script.run
          .withSuccessHandler(res => {
            $('save').disabled = false; $('save').textContent = 'Save item';
            if (!res.ok) return toast(res.error, false);
            toast(`${data.item} saved`, true);
            resetForm();
            loadSummary();
          })
          .withFailureHandler(err => {
            $('save').disabled = false; $('save').textContent = 'Save item';
            toast(err.message, false);
          })
          .addItem(data);
      });

      /* ---------- Summary + recent ---------- */
      function render(data) {
        $('month').textContent = 'Spent in ' + data.month;
        $('month-total').textContent = data.monthTotal;
        const n = Number(digits(data.monthItems)) || 0;
        $('month-items').textContent = n + (n === 1 ? ' item' : ' items');

        const sum = data.categories.reduce((a, c) => a + c.spend, 0);
        $('bar').innerHTML = data.categories.map(c =>
          `<span style="width:${sum ? (c.spend / sum) * 100 : 0}%;background:${color(c.name)}"></span>`).join('');
        $('legend').innerHTML = data.categories.slice(0, 4).map(c =>
          `<div><i style="background:${color(c.name)}"></i><span class="name">${esc(c.name)}</span><b>${esc(c.spendText)}</b></div>`).join('');

        $('recent').innerHTML = data.items.length
          ? data.items.map(i => {
              const c = i.category || 'Uncategorized';
              const meta = [i.date, i.category, i.quantity && `${i.quantity} ${i.unit}`.trim()].filter(Boolean).map(esc).join(' · ');
              return `<li class="item">
                <div class="avatar" style="background:color-mix(in srgb, ${color(c)} 16%, transparent)">${icon(c)}</div>
                <div class="info"><div class="name">${esc(i.item)}</div><div class="meta">${meta}</div></div>
                <div class="price">${esc(i.total)}</div>
              </li>`;
            }).join('')
          : '<li class="empty">No items yet. Add your first one above.</li>';
      }

      function loadSummary() {
        google.script.run.withSuccessHandler(render)
          .withFailureHandler(e => toast(e.message, false)).getRecentItems();
      }

      /* ---------- Init ---------- */
      $('today').textContent = new Date().toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
      $('date').value = localISO();
      google.script.run.withSuccessHandler(cfg => {
        renderChips(cfg.categories);
        fillSelect($('unit'), cfg.units);
        fillSelect($('location'), cfg.locations);
        loadSummary();
      }).withFailureHandler(e => toast(e.message, false)).getConfig();
    </script>
  </body>
</html>
